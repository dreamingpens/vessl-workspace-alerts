name: VESSL workspace 알림 등록
description: 감시할 workspace를 신청합니다. 운영자 승인 후 공용 Slack 채널로 중지 알림을 보냅니다.
title: '[알림 등록] '
labels: ['workspace-registration']
body:
  - type: markdown
    attributes:
      value: |
        ## Workspace 중지 알림 신청
        GitHub 계정만 있으면 신청할 수 있습니다. 저장소 수정 권한은 필요하지 않습니다.
        한 신청에 workspace 하나를 입력하세요. 운영자가 승인하면 다음 정기 확인부터 감시합니다.
        첫 확인에서 이미 중지된 상태여도 한 번 알립니다. 이후 실행 중이었다가 중지되면 다시 공용 Slack 채널로 알려드립니다.
        **공개 신청서입니다. VESSL 토큰, Slack Webhook URL 등 비밀 값은 적지 마세요.**
  - type: input
    id: workspace
    attributes:
      label: Workspace ID 또는 소유자/이름
      description: 숫자 ID 또는 VESSL Creator 사용자명/workspace 이름. 이름은 대소문자를 구분합니다.
      placeholder: '123456789 또는 alice/gpu-pod'
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 신청 확인
      options:
        - label: 위 workspace 정보가 공개되고, 중지 알림이 공용 Slack 채널에 전달되는 것을 확인했습니다.
          required: true
  - type: markdown
    attributes:
      value: |
        제출 후 운영자의 승인을 기다려 주세요. 같은 VESSL 조직에서 조회할 수 있는 workspace만 등록할 수 있습니다.
        감시를 취소하려면 이 이슈를 닫으세요. 다른 신청이나 기존 Variable에도 등록되어 있다면 감시가 계속됩니다.

        **운영자 안내:** 대상을 확인한 뒤 별도 댓글에 `/watch 소유자/이름` 또는 `/watch 숫자ID`를 한 줄로 작성하세요.
        댓글에 적은 대상이 승인됩니다. 이슈 본문 수정은 승인된 대상을 바꾸지 않습니다.
        승인 댓글을 수정하지 말고, 변경할 때는 새 명령 댓글을 남기세요. `/unwatch`로 승인을 취소할 수도 있습니다.
