name: VESSL workspace stop alerts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only verification: no messages or state changes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: workspace-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Job-level guard prevents allocating a billed runner if made private.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies without cache or artifact storage
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Test notification state handling
        run: python -m unittest discover -s tests -v
      - name: Check workspace state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          VESSL_ACCESS_TOKEN: ${{ secrets.VESSL_ACCESS_TOKEN }}
          VESSL_DEFAULT_ORGANIZATION: ${{ secrets.VESSL_DEFAULT_ORGANIZATION }}
          VESSL_WORKSPACE_IDS: ${{ secrets.VESSL_WORKSPACE_IDS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VESSL_SAVE_CONFIG: 'false'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
